[project]
name = "study-copilot"
version = "0.1.0"
description = "Adaptive learning platform built on a Neo4j knowledge graph of course topics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "fsrs>=6.3,<7",
    "httpx>=0.28,<1",
    "langchain-anthropic>=1.7,<2",
    "langchain-core>=1.7,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-openai>=1.7,<2",
    "neo4j>=5.28,<6",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pymupdf>=2.1,<3",
    "pytesseract>=0.3.13,<1",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.33,<1",
    "python-pptx>=1.0.2,<2",
    "trafilatura>=2.3,<3",
    "uvicorn[standard]>=0.54,<1",
    "youtube-transcript-api>=1.2.5,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "core", "eval", "scripts", "tests", "workers"]

[[tool.mypy.overrides]]
# Untyped third-party extractors.
module = ["pytesseract", "pptx.*", "docx.*", "trafilatura.*", "youtube_transcript_api.*", "fsrs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["core.sources.*"]
disallow_untyped_calls = false  # pymupdf is only partly annotated

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false  # neo4j's exception classes are unannotated

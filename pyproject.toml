[project]
name = "study-copilot"
version = "0.1.0"
description = "Adaptive learning platform built on a Neo4j knowledge graph of course topics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40,<1",
    "fastapi>=0.162,<1",
    "neo4j>=5.28,<6",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pypdf>=6.21,<7",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "core", "scripts", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false  # neo4j's exception classes are unannotated
